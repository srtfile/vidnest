<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VidNest API</title>
</head>
<body>
<script>
// ═══════════════════════════════════════════════════════════════════
//  VidNest JSON API
//  Usage:
//    Movie : /api.html?type=movie&id=254
//    TV    : /api.html?type=tv&id=3119&season=1&episode=5
//
//  Response (JSON):
//  {
//    "status": "ok",
//    "query": { "type": "movie", "id": "254" },
//    "proxy": "corsproxy.io",
//    "total": 8,
//    "streams": [
//      {
//        "server": "alfa",
//        "status": "ok",
//        "streams": [
//          { "url": "https://...", "type": "hls" },
//          ...
//        ]
//      },
//      {
//        "server": "gama",
//        "status": "error",
//        "error": "HTTP 403",
//        "streams": []
//      }
//    ]
//  }
// ═══════════════════════════════════════════════════════════════════

const ALPHA = "RB0fpH8ZEyVLkv7c2i6MAJ5u3IKFDxlS1NTsnGaqmXYdUrtzjwObCgQP94hoeW+/=";

const SERVERS = {
  catflix: "movies4f",
  ophim:   "klikxxi",
  alfa:    "moviesapi",
  beta:    "purstream",
  lamda:   "allmovies",
  prime:   "catflix",
  hexa:    "vidlink",
  sigma:   "hollymoviehd",
  gama:    "flixhq",
  delta:   "allmovies",
};

const PROXY_LIST = [
  { name: "corsproxy.io",      wrap: u => `https://corsproxy.io/?url=${encodeURIComponent(u)}` },
  { name: "allorigins",        wrap: u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}` },
  { name: "codetabs",          wrap: u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}` },
  { name: "htmldriven",        wrap: u => `https://cors.htmldriven.com/?url=${encodeURIComponent(u)}` },
  { name: "thingproxy",        wrap: u => `https://thingproxy.freeboard.io/fetch/${u}` },
  { name: "corsanywhere-demo", wrap: u => `https://cors-anywhere.herokuapp.com/${u}` },
];

const SUBTITLE_HOSTS = ["opensubtitles.org","opensubtitles.com","wyzie.io","vdrk.site"];
const SUBTITLE_EXTS  = [".vtt",".srt",".ass",".ssa"];

let activeProxy = null;

// ── Decoder ───────────────────────────────────────────────────────
function decode(data) {
  const val = {};
  for (let i = 0; i < ALPHA.length; i++) val[ALPHA[i]] = i;
  data = data.replace(/\s+/g, "");
  const out = [];
  for (let i = 0; i < data.length; i += 4) {
    const chunk = (data.slice(i, i+4) + "====").slice(0, 4);
    const n = chunk.split("").map(c => val[c] ?? 64);
    out.push((n[0] << 2) | (n[1] >> 4));
    if (n[2] !== 64) out.push(((n[1] & 15) << 4) | (n[2] >> 2));
    if (n[3] !== 64) out.push(((n[2] & 3) << 6) | n[3]);
  }
  return JSON.parse(new TextDecoder().decode(new Uint8Array(out)));
}

// ── Helpers ───────────────────────────────────────────────────────
function isSub(url) {
  const u = url.toLowerCase();
  return SUBTITLE_HOSTS.some(h => u.includes(h)) ||
         SUBTITLE_EXTS.some(e => u.split("?")[0].endsWith(e));
}

function detectType(url) {
  const u = url.toLowerCase().split("?")[0];
  if (u.endsWith(".mp4"))  return "mp4";
  if (u.endsWith(".mpd"))  return "dash";
  if (u.endsWith(".webm")) return "webm";
  return "hls";
}

function transformUrl(url) {
  try {
    const u = new URL(url);
    if (u.hostname === "goodstream.cc") {
      const segs = u.pathname.split("/").filter(Boolean);
      if ((segs[0] === "streamsvr" || segs[0] === "pl") && segs[1]) {
        return `${u.protocol}//${u.hostname}/embed/${segs[1]}`;
      }
    }
  } catch {}
  return url;
}

function extractUrls(obj, found = []) {
  if (!obj || typeof obj !== "object") return found;
  if (Array.isArray(obj)) { obj.forEach(v => extractUrls(v, found)); return found; }
  for (const [k, v] of Object.entries(obj)) {
    if ((k === "url" || k === "file") && typeof v === "string" && v.startsWith("http")) {
      if (!isSub(v)) found.push(transformUrl(v));
    } else {
      extractUrls(v, found);
    }
  }
  return found;
}

// ── Proxy negotiation ─────────────────────────────────────────────
async function probeProxy(proxy) {
  const testUrl = "https://new.vidnest.fun/moviesapi/movie/254";
  try {
    const r = await fetch(proxy.wrap(testUrl), { signal: AbortSignal.timeout(8000) });
    if (!r.ok) return false;
    const raw = await r.json();
    return !!(raw?.data);
  } catch { return false; }
}

async function findProxy() {
  for (const proxy of PROXY_LIST) {
    const ok = await probeProxy(proxy);
    if (ok) { activeProxy = proxy; return true; }
  }
  return false;
}

// ── Fetch one server ──────────────────────────────────────────────
async function fetchServer(backend, path) {
  const target = `https://new.vidnest.fun/${backend}/${path}`;
  const r = await fetch(activeProxy.wrap(target), { signal: AbortSignal.timeout(14000) });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const raw = await r.json();
  if (!raw?.data) throw new Error("no data field");
  return extractUrls(decode(raw.data));
}

// ── Output helpers ────────────────────────────────────────────────
function sendJSON(obj) {
  // Render JSON prettily in the page so browser treats it as an API response
  document.open();
  document.write('<pre style="font-family:monospace;font-size:14px;padding:20px;background:#0f0f0f;color:#e0e0e0;min-height:100vh;margin:0">' +
    JSON.stringify(obj, null, 2) + '</pre>');
  document.close();
}

// ── Main ──────────────────────────────────────────────────────────
async function main() {
  const params  = new URLSearchParams(window.location.search);
  // Also support ?r= route from 404.html redirect
  const r       = params.get("r");
  let type, id, season, episode;

  if (r) {
    // Route from 404.html: /movie/254 or /tv/3119/1/5
    const movieMatch = r.match(/^\/movie\/(\d+)/);
    const tvMatch    = r.match(/^\/tv\/(\d+)\/(\d+)\/(\d+)/);
    if (movieMatch) { type = "movie"; id = movieMatch[1]; season = "1"; episode = "1"; }
    else if (tvMatch) { type = "tv"; id = tvMatch[1]; season = tvMatch[2]; episode = tvMatch[3]; }
  } else {
    type    = params.get("type") || params.get("t");
    id      = params.get("id")   || params.get("tmdb");
    season  = params.get("season")  || params.get("s") || "1";
    episode = params.get("episode") || params.get("e") || "1";
  }

  // ── Validate ──
  if (!id || !type) {
    return sendJSON({
      status: "error",
      error: "Missing required parameters",
      usage: {
        movie: "?type=movie&id=254",
        tv:    "?type=tv&id=3119&season=1&episode=5",
        short: "?t=movie&id=254  or  ?t=tv&id=3119&s=1&e=5"
      }
    });
  }
  if (!["movie","tv"].includes(type)) {
    return sendJSON({ status: "error", error: "type must be 'movie' or 'tv'" });
  }

  const path = type === "movie"
    ? `movie/${id}`
    : `tv/${id}/${season}/${episode}`;

  const query = type === "movie"
    ? { type, id }
    : { type, id, season, episode };

  // ── Find proxy ──
  const proxyFound = await findProxy();
  if (!proxyFound) {
    return sendJSON({ status: "error", error: "All CORS proxies failed. Try again later.", query });
  }

  // ── Fetch all servers in parallel ──
  const jobs = Object.entries(SERVERS).map(async ([name, backend]) => {
    try {
      const urls = await fetchServer(backend, path);
      return {
        server:  name,
        status:  "ok",
        streams: urls.map(url => ({ url, type: detectType(url) }))
      };
    } catch (e) {
      // One retry on network/proxy error
      if (e.message.includes("Failed to fetch") || e.message.includes("NetworkError")) {
        activeProxy = null;
        const retryOk = await findProxy();
        if (retryOk) {
          try {
            const urls = await fetchServer(backend, path);
            return {
              server:  name,
              status:  "ok",
              streams: urls.map(url => ({ url, type: detectType(url) }))
            };
          } catch (e2) {
            return { server: name, status: "error", error: e2.message, streams: [] };
          }
        }
      }
      return { server: name, status: "error", error: e.message, streams: [] };
    }
  });

  const results = await Promise.all(jobs);
  const total   = results.reduce((n, r) => n + r.streams.length, 0);

  sendJSON({
    status: "ok",
    query,
    proxy: activeProxy?.name ?? "unknown",
    total,
    streams: results
  });
}

main();
</script>
</body>
</html>
